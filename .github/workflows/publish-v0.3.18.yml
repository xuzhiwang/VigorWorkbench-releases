name: Publish v0.3.18 feed

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.18.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://congress-meaning-rush-howard.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.18-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.18-x64.exe.blockmap"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.18-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.18-x64.exe"
          echo '7906e2ce30335d92cc9aae6dc1b87200826fe453ff011d0b2901f27df95ffa83  VigorWorkbench-Setup-0.3.18-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.18-x64.exe)" -eq 158454709
          echo 'ccffbe37014d5d0266c9a27b1923502ce0386a57bb9c89fdfe4d4a95e61eb0b2  VigorWorkbench-Setup-0.3.18-x64.exe.blockmap' | sha256sum -c
          echo '85796544778c7d390ea60e84ccd6e599ab1db21b49cc27d169553a8a9debb009  latest.yml' | sha256sum -c
          gh release create v0.3.18 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.18 \
            --notes 'VigorWorkbench 0.3.18 Windows x64 NSIS Setup (relation extract/dedup/verify Goal on 7f56a7cb). Setup sha256 7906e2ce30335d92cc9aae6dc1b87200826fe453ff011d0b2901f27df95ffa83 size 158454709. 0.3.17 assets remain intact.' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.18-x64.exe \
            VigorWorkbench-Setup-0.3.18-x64.exe.blockmap
