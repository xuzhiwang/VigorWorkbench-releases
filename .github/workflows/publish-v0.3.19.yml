name: Publish v0.3.19 feed

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://institutes-mega-chronic-sequences.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.19-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.19-x64.exe.blockmap"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.19-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.19-x64.exe"
          echo 'a2f10a8ed8fc16727ab88af133bbe832a1563263a0447bad4bf96a355b27d098  VigorWorkbench-Setup-0.3.19-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.19-x64.exe)" -eq 158473292
          echo 'ac5b0ad3fee85b3eecd88c95cf33e6634ce9e25386cca026d6b92ad4e53a1b89  VigorWorkbench-Setup-0.3.19-x64.exe.blockmap' | sha256sum -c
          echo 'd9d42a013524ec74b6a32fdac0d400994df8906f78af4b33a65dbbeb8a12b9dd  latest.yml' | sha256sum -c
          gh release create v0.3.19 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.19 \
            --notes 'VigorWorkbench 0.3.19 Windows x64 NSIS Setup (GOAL-WORK-DETAIL-HTML-V1 on 79f29df + lockstep 20d61e7). Setup sha256 a2f10a8ed8fc16727ab88af133bbe832a1563263a0447bad4bf96a355b27d098 size 158473292. 0.3.18 assets remain intact.' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.19-x64.exe \
            VigorWorkbench-Setup-0.3.19-x64.exe.blockmap
