name: Publish acceptance-today-focus-crud-a86111f4 prerelease

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-acceptance-today-focus-crud-a86111f4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch artifacts and create prerelease (do not mark latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: xuzhiwang/VigorWorkbench-releases
          FEED_BASE: https://drew-bargain-about-donation.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o vwb.exe "$FEED_BASE/vwb.exe"
          curl -fL --retry 5 --retry-delay 2 -o VigorWorkbenchCore.exe "$FEED_BASE/VigorWorkbenchCore.exe"
          curl -fL --retry 5 --retry-delay 2 -o better_sqlite3.node "$FEED_BASE/better_sqlite3.node"
          echo '82de72996f220428817e8648dff80654dd4ad92bfcfe98e969bd5df6b8320e77  vwb.exe' | sha256sum -c
          echo 'fe271f4f8792347b80ee7f78da92a4c4fa1f460b598ad258b46eb0faaea4e404  VigorWorkbenchCore.exe' | sha256sum -c
          echo 'e21e5efd71fba66578e95b62554d9028064a80dafd7221bf8a8ef155de8d240a  better_sqlite3.node' | sha256sum -c
          test "$(stat -c%s vwb.exe)" -eq 85868544
          test "$(stat -c%s VigorWorkbenchCore.exe)" -eq 85976064
          test "$(stat -c%s better_sqlite3.node)" -eq 1989632
          gh release create acceptance-today-focus-crud-a86111f4 --repo xuzhiwang/VigorWorkbench-releases --title "ACCEPTANCE ONLY - today-focus CRUD CLI a86111f4 (NOT PO Setup)" --prerelease --notes "ACCEPTANCE ONLY for Sentinel Wine black-box; NOT PO Setup; tip a86111f4; do not use as updater feed (do NOT replace latest.yml). Tip: a86111f4af98925dd011083bac780f786c769abf. Branch: feat/today-focus-crud-cli. PR: https://github.com/xuzhiwang/VigorWorkbench/pull/102. This prerelease is not latest and does not replace latest.yml / Setup / blockmap for 0.3.19. sha256 vwb.exe=82de72996f220428817e8648dff80654dd4ad92bfcfe98e969bd5df6b8320e77 VigorWorkbenchCore.exe=fe271f4f8792347b80ee7f78da92a4c4fa1f460b598ad258b46eb0faaea4e404 better_sqlite3.node=e21e5efd71fba66578e95b62554d9028064a80dafd7221bf8a8ef155de8d240a" vwb.exe VigorWorkbenchCore.exe better_sqlite3.node
