name: Publish v0.3.25 feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.25.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://entries-absolutely-workout-melbourne.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.25-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.25-x64.exe.blockmap"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.25-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.25-x64.exe"
          echo '84fea139588712ace5b1c84798579fc383f15b64b14a9bcba7f16e93c731027d  VigorWorkbench-Setup-0.3.25-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.25-x64.exe)" -eq 158518565
          echo '3940257eb0054a9a311160494c8aaf873ccfa931c6e90ed7bf35fbee1d10c8b8  VigorWorkbench-Setup-0.3.25-x64.exe.blockmap' | sha256sum -c
          echo '1432192f808c8556df241ae9ee4abdd42b92ea4b2943974473205c5867e5f90c  latest.yml' | sha256sum -c
          gh release create v0.3.25 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.25 \
            --notes 'VigorWorkbench 0.3.25 Windows x64 NSIS Setup (workspace left tree P02 on cd764c13 + lockstep merge 4a00295). Setup sha256 84fea139588712ace5b1c84798579fc383f15b64b14a9bcba7f16e93c731027d size 158518565. 0.3.24 assets remain intact.' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.25-x64.exe \
            VigorWorkbench-Setup-0.3.25-x64.exe.blockmap
