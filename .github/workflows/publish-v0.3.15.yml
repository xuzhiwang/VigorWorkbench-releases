name: Publish v0.3.15 feed

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.15.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://paragraphs-circuit-item-katrina.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 5 --retry-delay 2 -o VigorWorkbench-Setup-0.3.15-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.15-x64.exe.blockmap"
          curl -fL --retry 5 --retry-delay 2 -o VigorWorkbench-Setup-0.3.15-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.15-x64.exe"
          echo '987d51cdfdd81cdd7909d711a1dcadd9109df06ea3beeaf9b8aab9efd51715e1  VigorWorkbench-Setup-0.3.15-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.15-x64.exe)" -eq 158616711
          echo '0c7a9356e91e8964519f0b4764457561866907de169f8f92b7b034eee2f6d572  VigorWorkbench-Setup-0.3.15-x64.exe.blockmap' | sha256sum -c
          gh release create v0.3.15 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.15 \
            --notes 'VigorWorkbench 0.3.15 Windows x64 NSIS Setup (v0.19 CLI work delete). Setup sha256 987d51cdfdd81cdd7909d711a1dcadd9109df06ea3beeaf9b8aab9efd51715e1 size 158616711' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.15-x64.exe \
            VigorWorkbench-Setup-0.3.15-x64.exe.blockmap
