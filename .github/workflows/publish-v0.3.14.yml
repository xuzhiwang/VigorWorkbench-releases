name: Publish v0.3.14 feed

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: xuzhiwang/VigorWorkbench-releases
          FEED_BASE: https://turns-swim-lexmark-millennium.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 5 --retry-delay 2 -o VigorWorkbench-Setup-0.3.14-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.14-x64.exe.blockmap"
          curl -fL --retry 5 --retry-delay 2 -o VigorWorkbench-Setup-0.3.14-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.14-x64.exe"
          echo '92245decb31303faa49820ea5726110030c6829eaa45d4104b54067fab49857e  VigorWorkbench-Setup-0.3.14-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.14-x64.exe)" -eq 158613063
          echo 'cf4e5c20290ccf0d92dbe9df9ab8fa1a4f59e0b640a5eacd7defbda676b34209  VigorWorkbench-Setup-0.3.14-x64.exe.blockmap' | sha256sum -c
          gh release create v0.3.14 --repo xuzhiwang/VigorWorkbench-releases --title v0.3.14 --notes 'VigorWorkbench 0.3.14 Windows x64 NSIS Setup (v0.18 work-detail links). Setup sha256 92245decb31303faa49820ea5726110030c6829eaa45d4104b54067fab49857e size 158613063' --latest latest.yml VigorWorkbench-Setup-0.3.14-x64.exe VigorWorkbench-Setup-0.3.14-x64.exe.blockmap
