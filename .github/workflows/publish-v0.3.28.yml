name: Publish v0.3.28 feed
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v0.3.28.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://registration-modem-carol-clip.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.28-x64.exe.blockmap \
            "$FEED_BASE/VigorWorkbench-Setup-0.3.28-x64.exe.blockmap"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.28-x64.exe \
            "$FEED_BASE/VigorWorkbench-Setup-0.3.28-x64.exe"
          echo '2a62d0faaf7ccb7ecc6646b5c6bbaf8e6130b752da1249fc2d6ea1598efe07a9  VigorWorkbench-Setup-0.3.28-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.28-x64.exe)" -eq 158585379
          echo 'e5f4d9b240fd184ca94f0a2edfd2c5c86ea848da3b31842c361d0b06a6cca69b  VigorWorkbench-Setup-0.3.28-x64.exe.blockmap' | sha256sum -c
          echo '5a59c24124896c33514b2d81294dc994788a5dcbe8c83f52b07501bf8a146269  latest.yml' | sha256sum -c
          gh release create v0.3.28 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.28 \
            --notes 'VigorWorkbench 0.3.28 Windows x64 NSIS Setup (workspace idle match-wash on 4c3a59bf + lockstep merge aa520da). Setup sha256 2a62d0faaf7ccb7ecc6646b5c6bbaf8e6130b752da1249fc2d6ea1598efe07a9 size 158585379. 0.3.27 assets remain intact.' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.28-x64.exe \
            VigorWorkbench-Setup-0.3.28-x64.exe.blockmap
