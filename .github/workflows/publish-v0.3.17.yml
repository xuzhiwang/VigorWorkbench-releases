name: Publish v0.3.17 feed

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.17.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://cumulative-discounts-born-compression.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 5 --retry-delay 2 -o VigorWorkbench-Setup-0.3.17-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.17-x64.exe.blockmap"
          curl -fL --retry 5 --retry-delay 2 -o VigorWorkbench-Setup-0.3.17-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.17-x64.exe"
          echo '8b6e7116a43e9f5f42eba4869543ebf2cd40b8a6ce81a229cc00f4c34854d70d  VigorWorkbench-Setup-0.3.17-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.17-x64.exe)" -eq 158433772
          echo '01d1b6c4a9fbbdb55b4e2895c25baff993764e2764940a726d881d02c86ce6bb  VigorWorkbench-Setup-0.3.17-x64.exe.blockmap' | sha256sum -c
          gh release create v0.3.17 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.17 \
            --notes 'VigorWorkbench 0.3.17 Windows x64 NSIS Setup (stacked Goals: item-open, resize-perf, overview switch, CLI work API schema 9, fold-stay). Setup sha256 8b6e7116a43e9f5f42eba4869543ebf2cd40b8a6ce81a229cc00f4c34854d70d size 158433772' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.17-x64.exe \
            VigorWorkbench-Setup-0.3.17-x64.exe.blockmap
