name: Publish v0.3.21 feed

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.21.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://guarantee-past-chapter-ontario.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.21-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.21-x64.exe.blockmap"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.21-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.21-x64.exe"
          echo 'ab820e54cc51fdb117d056a4a7211cb82f94cf9222d516fd93ca8c3ef30abf8a  VigorWorkbench-Setup-0.3.21-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.21-x64.exe)" -eq 158474253
          echo 'b04c23b4303972b551d172c8c9b6716351b4cdd00589223d728a317e29da2d12  VigorWorkbench-Setup-0.3.21-x64.exe.blockmap' | sha256sum -c
          echo 'b25bc04efbbafbc79ecbb7c99b1b69e77c00d1408d51c623fd3ea86b02ed5149  latest.yml' | sha256sum -c
          gh release create v0.3.21 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.21 \
            --notes 'VigorWorkbench 0.3.21 Windows x64 NSIS Setup (GOAL-TOOLBAR-UPDATE-AFFORDANCE on 887ff6209f93ea54dfc391dff2cb380118646579 + lockstep 1c19c23). Setup sha256 ab820e54cc51fdb117d056a4a7211cb82f94cf9222d516fd93ca8c3ef30abf8a size 158474253. 0.3.20 assets remain intact.' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.21-x64.exe \
            VigorWorkbench-Setup-0.3.21-x64.exe.blockmap
