name: Publish v0.3.24 feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.24.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch pack artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_BASE: https://madrid-plus-wife-publicly.trycloudflare.com
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 2 -o latest.yml "$FEED_BASE/latest.yml"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.24-x64.exe.blockmap "$FEED_BASE/VigorWorkbench-Setup-0.3.24-x64.exe.blockmap"
          curl -fL --retry 8 --retry-delay 2 -o VigorWorkbench-Setup-0.3.24-x64.exe "$FEED_BASE/VigorWorkbench-Setup-0.3.24-x64.exe"
          echo '4082c708958908a203c6c47f33578742ea4af7ca57345eecff171f256b2e70c3  VigorWorkbench-Setup-0.3.24-x64.exe' | sha256sum -c
          test "$(stat -c%s VigorWorkbench-Setup-0.3.24-x64.exe)" -eq 158514816
          echo '15947d5c5d1512b101bb3e370dcc2d61291ac4aa0fc8f642a2ed118808edc521  VigorWorkbench-Setup-0.3.24-x64.exe.blockmap' | sha256sum -c
          echo 'e84eaa111f5f04b4415f4531747c8931692413e1d469e9e595d904ef571ba34a  latest.yml' | sha256sum -c
          gh release create v0.3.24 \
            --repo xuzhiwang/VigorWorkbench-releases \
            --title v0.3.24 \
            --notes 'VigorWorkbench 0.3.24 Windows x64 NSIS Setup (Today left tree P02 on 4edb25b + lockstep merge c626c56). Setup sha256 4082c708958908a203c6c47f33578742ea4af7ca57345eecff171f256b2e70c3 size 158514816. 0.3.23 assets remain intact.' \
            --latest \
            latest.yml \
            VigorWorkbench-Setup-0.3.24-x64.exe \
            VigorWorkbench-Setup-0.3.24-x64.exe.blockmap
